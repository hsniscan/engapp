# Kelime Bankası generation job (v0.4 wave 2, decision 0038). Fills public.word_bank: Turkish
# meaning(s) and one example sentence per meaning for every word of the CEFR-J and Octanove
# lists. Meanings the shared lexicon already has are reused (no model call); the rest go to
# Claude Haiku as one Message Batch (half price). Every batch reserves its upper-bound cost on
# the monthly Claude budget shared with the picture jobs (80 % of CLAUDE_MONTHLY_CREDIT_USD).
# Expected total for the ~10 000 words: about 2 US$. Details: docs/setup-backend.md
# ("Kelime Bankası"), docs/ai-pipeline.md ("Word bank").
#
# Usual sequence: run `plan` (reads only), then `run` (submits the batch); a batch finishes
# within 24 hours; run `run` again to collect it and send the retries; repeat until `plan`
# reports nothing pending. With the repository variable WORD_BANK_NIGHTLY=true the `run` step
# also happens every night.
#
# Review pass (decision 0040): `review-plan` reports how many rows still need their review and
# the estimated / upper-bound cost (sends nothing); `review` collects finished review batches,
# applies the corrections and prints example changes, then sends the rows not yet reviewed
# (max = at most this many rows; dry_run = report only). Run `review` again after the batch
# ends (usually within an hour) to apply it. Model: CLAUDE_WORDBANK_REVIEW_MODEL, else the
# default Sonnet (about $1-2 for the whole bank).
#
# Phrasal verbs and collocations (v0.5.3 C4, decision 0074): `phrases` downloads the Wiktionary
# "English phrasal verbs" titles (CC BY-SA 4.0), the Tatoeba English sentences (CC BY 2.0 FR)
# and, unless wiki is off, Simple English Wikipedia (CC BY-SA 4.0), ranks ~500 phrasal verbs and
# ~300 verb + noun collocations by how often they occur, levels them by frequency band and
# stores them in ref_phrases (free, no model call; the lists are kept as a run artifact).
# After it, `run` gives them Turkish meanings and examples like any list word (under 2 US$
# with the review) and `review` checks them; the app shows the "Kalıplar" decks once they exist.
#
# Repository secrets:
#   ANTHROPIC_API_KEY          Claude API key (without it submit/collect are skipped)
#   SUPABASE_SERVICE_ROLE_KEY  optional: the project's service_role (or sb_secret_) key.
#                              Without it the key is read through the Management API with
#   SUPABASE_ACCESS_TOKEN      (needs the "API keys: Read" permission / a full-access token).
# Repository variables (optional): CLAUDE_WORDBANK_MODEL (else CLAUDE_CHECK_MODEL, else the
#   default Haiku), CLAUDE_WORDBANK_REVIEW_MODEL (else the default Sonnet),
#   CLAUDE_MONTHLY_CREDIT_USD (default 100), WORD_BANK_NIGHTLY
name: Word bank job

on:
  schedule:
    - cron: '45 3 * * *' # 03:45 UTC; does nothing unless WORD_BANK_NIGHTLY is 'true'
  workflow_dispatch:
    inputs:
      job:
        description: 'plan: report only; run: collect finished batches, then submit the rest; collect / submit: one step; sample: print the newest rows (max = how many); review-plan: review cost, sends nothing; review: apply finished review batches, then send the rest'
        type: choice
        options: [plan, run, collect, submit, sample, review-plan, review, phrases]
        default: plan
      max:
        description: 'submit / review: at most this many words in the batch (empty: 10000)'
        type: string
        default: ''
      dry_run:
        description: 'submit / review: build the batch and report its cost, send nothing (phrases: build the lists, store nothing)'
        type: boolean
        default: false
      wiki:
        description: 'phrases: also count in Simple English Wikipedia (slower, less chat-heavy)'
        type: boolean
        default: true

concurrency:
  group: word-bank
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: bikcjlomrjaxymifxogi

jobs:
  word-bank:
    if: github.event_name == 'workflow_dispatch' || vars.WORD_BANK_NIGHTLY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Service key (the only step that may use the access token)
        env:
          SERVICE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: scripts/resolve-service-key.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download the phrase corpora (phrases only)
        if: inputs.job == 'phrases'
        env:
          WIKI: ${{ inputs.wiki && 'yes' || '' }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/corpora"
          mkdir -p "$dir"
          curl -fsSL --retry 3 https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2 | bunzip2 > "$dir/eng_sentences.tsv"
          args="--corpus $dir/eng_sentences.tsv"
          if [ -n "$WIKI" ]; then
            if curl -fsSL --retry 3 -A 'EngappContentBuilder/1.0 (github.com/hsniscan/engapp)' https://dumps.wikimedia.org/simplewiki/latest/simplewiki-latest-pages-articles.xml.bz2 | bunzip2 > "$dir/simplewiki.xml"; then
              args="$args --wiki $dir/simplewiki.xml"
            else
              echo "::warning::Simple English Wikipedia could not be downloaded; counting in Tatoeba only"
            fi
          fi
          echo "PHRASE_ARGS=$args" >> "$GITHUB_ENV"
          wc -l "$dir"/* || true

      - name: Run the word bank job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_WORDBANK_MODEL: ${{ vars.CLAUDE_WORDBANK_MODEL }}
          CLAUDE_WORDBANK_REVIEW_MODEL: ${{ vars.CLAUDE_WORDBANK_REVIEW_MODEL }}
          CLAUDE_CHECK_MODEL: ${{ vars.CLAUDE_CHECK_MODEL }}
          CLAUDE_MONTHLY_CREDIT_USD: ${{ vars.CLAUDE_MONTHLY_CREDIT_USD }}
          JOB: ${{ inputs.job || 'run' }}
          MAX: ${{ inputs.max }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          case "$JOB" in plan|run|collect|submit|sample|review-plan|review|phrases) ;; *) echo "::error::Unknown job"; exit 1 ;; esac
          if [ -n "$MAX" ] && ! [[ "$MAX" =~ ^[0-9]{1,5}$ ]]; then echo "::error::max must be a whole number"; exit 1; fi
          source scripts/supabase-service-env.sh
          submit_args=(submit)
          if [ -n "$MAX" ]; then submit_args+=(--max "$MAX"); fi
          if [ -n "$DRY_RUN" ]; then submit_args+=("$DRY_RUN"); fi
          case "$JOB" in
            plan)
              node scripts/word-bank.ts plan
              ;;
            run)
              node scripts/word-bank.ts collect
              node scripts/word-bank.ts "${submit_args[@]}"
              node scripts/word-bank.ts plan
              ;;
            collect)
              node scripts/word-bank.ts collect
              ;;
            submit)
              node scripts/word-bank.ts "${submit_args[@]}"
              ;;
            sample)
              node scripts/word-bank.ts sample ${MAX:+--limit "$MAX"}
              ;;
            review-plan)
              node scripts/word-bank.ts review-submit --dry-run ${MAX:+--max "$MAX"}
              ;;
            phrases)
              # shellcheck disable=SC2086
              node scripts/build-phrases.ts $PHRASE_ARGS --out "$RUNNER_TEMP/phrases" --upload ${DRY_RUN:+--dry-run}
              node scripts/word-bank.ts plan
              ;;
            review)
              if [ -z "$DRY_RUN" ]; then node scripts/word-bank.ts review-collect; fi
              review_args=(review-submit)
              if [ -n "$MAX" ]; then review_args+=(--max "$MAX"); fi
              if [ -n "$DRY_RUN" ]; then review_args+=("$DRY_RUN"); fi
              node scripts/word-bank.ts "${review_args[@]}"
              ;;
          esac

      - name: Keep the phrase lists
        if: inputs.job == 'phrases' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phrase-lists
          path: ${{ runner.temp }}/phrases/
          if-no-files-found: ignore
          retention-days: 30

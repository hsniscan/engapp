# Tests the database (pgTAP) and the edge functions, then deploys the backend to the
# Supabase project. Deploys only on pushes to main that touch supabase/** and on manual
# runs; pull requests run the tests only. Setup: docs/setup-backend.md.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    the database password of the project
#   GEMINI_API_KEY          Google AI Studio API key
# Repository variables (same page > Variables), all optional:
#   GEMINI_MODEL, GEMINI_FALLBACK_MODEL, AI_DAILY_LIMIT, ALLOWED_ORIGINS
name: Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bikcjlomrjaxymifxogi
  SUPABASE_REGION: eu-west-1
  SUPABASE_CLI_VERSION: 2.121.0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # config.toml enables Google sign-in; the local test stack only needs placeholders.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the tts function (Deno)
        working-directory: supabase/functions/tts
        run: deno check index.ts
      - name: Type-check edge functions (Deno)
        working-directory: supabase/functions
        run: |
          for fn in ai-extract ai-enrich ai-examples ai-themes; do (cd "$fn" && deno check index.ts); done
      - name: Start local database
        # Only Postgres + Auth are needed for the SQL tests.
        run: supabase start -x studio,imgproxy,vector,logflare,storage-api,realtime,supavisor,mailpit,postgres-meta,edge-runtime,kong,postgrest
      - name: SQL security tests (pgTAP)
        run: supabase test db
      - name: Stop
        if: always()
        run: supabase stop --no-backup

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Check secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD GEMINI_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set (see docs/setup-backend.md)"; missing=1; fi
          done
          exit $missing

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # GitHub runners have no IPv6 and the direct database host is IPv6-only,
      # so migrations go through the project's IPv4 session pooler.
      - name: Apply database migrations
        run: |
          set -euo pipefail
          pass=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$pass"
          status=$(curl -sS -o pooler.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")
          if [ "$status" = "200" ]; then
            host=$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_host' pooler.json)
            user=$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_user' pooler.json)
            name=$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_name' pooler.json)
            supabase db push --db-url "postgresql://$user:$pass@$host:5432/$name" --yes
            exit 0
          fi
          # Token without 'Connection Pooling: Read': try the regional pooler hosts directly.
          echo "::warning::Pooler config not readable (HTTP $status); trying regional pooler hosts."
          for host in aws-0-$SUPABASE_REGION.pooler.supabase.com aws-1-$SUPABASE_REGION.pooler.supabase.com; do
            if supabase db push --db-url "postgresql://postgres.$SUPABASE_PROJECT_REF:$pass@$host:5432/postgres" --yes; then
              exit 0
            fi
          done
          echo "::error::Could not reach the database pooler. Give the SUPABASE_ACCESS_TOKEN the 'Connection Pooling: Read' permission."
          exit 1

      - name: Set function secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
          # Pronunciation audio (tts function, docs/decisions/0028-server-tts.md); optional variables.
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          GEMINI_TTS_FALLBACK_MODEL: ${{ vars.GEMINI_TTS_FALLBACK_MODEL || 'gemini-3.8-flash-lite-tts' }}
          TTS_DAILY_LIMIT: ${{ vars.TTS_DAILY_LIMIT || '150' }}
          AI_DAILY_LIMIT: ${{ vars.AI_DAILY_LIMIT || '200' }}
          ALLOWED_ORIGINS: ${{ format('{0},https://engapp-65y.pages.dev,http://localhost:5173', vars.ALLOWED_ORIGINS) }}
        run: |
          # Written to a temp file (not the command line) so values never show in logs.
          set -euo pipefail
          umask 077
          f="$(mktemp)"
          trap 'rm -f "$f"' EXIT # also when `secrets set` fails
          {
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "GEMINI_MODEL=$GEMINI_MODEL"
            echo "GEMINI_FALLBACK_MODEL=$GEMINI_FALLBACK_MODEL"
            echo "GEMINI_TTS_MODEL=$GEMINI_TTS_MODEL"
            echo "GEMINI_TTS_FALLBACK_MODEL=$GEMINI_TTS_FALLBACK_MODEL"
            echo "TTS_DAILY_LIMIT=$TTS_DAILY_LIMIT"
            echo "AI_PROVIDER=gemini"
            echo "AI_DAILY_LIMIT=$AI_DAILY_LIMIT"
            echo "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
          } > "$f"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$f"

      - name: Deploy edge functions
        # verify_jwt = false comes from supabase/config.toml; the functions verify the JWT themselves.
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

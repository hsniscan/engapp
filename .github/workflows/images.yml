# Picture jobs (v0.4 İP2, decision 0030). Every night: collect the finished Message Batch
# (checks, stores pictures for review, one redraw after a failed check), score new senses with
# visual-v1, then submit the next batch. On demand: one of the jobs, or the pilot (50 random
# concrete senses drawn now and stored for review, with their cost). Every model call is
# reserved against the monthly picture budget first (80 % of CLAUDE_MONTHLY_CREDIT_USD).
# Without the ANTHROPIC_API_KEY secret the run is skipped with a notice. The nightly run
# submits a new batch of up to 2000 senses every night: bulk drawing is on by default now that
# pictures are watercolour (image-v2, owner, 2026-10-25), and it also redraws every flat
# (image-v1) picture. Setting the repository variable IMAGE_BULK to 'false' pauses it.
# Queue order: decision 0037. Every step ends with a heartbeat
# (public.job_runs). Details: docs/ai-image.md, docs/setup-backend.md (steps 12, 13).
#
# Repository secrets:
#   ANTHROPIC_API_KEY          Claude API key (optional until the owner adds it)
#   SUPABASE_SERVICE_ROLE_KEY  optional: the project's service_role (or sb_secret_) key.
#                              Without it the key is read through the Management API with
#   SUPABASE_ACCESS_TOKEN      (needs the "API keys: Read" permission / a full-access token).
# Repository variables (optional): CLAUDE_IMAGE_MODEL, CLAUDE_CHECK_MODEL,
#   CLAUDE_MONTHLY_CREDIT_USD (default 100), IMAGE_BULK ('false': nightly bulk drawing paused)
name: Picture jobs

on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC: nightly (collect, score, submit)
    # A batch usually finishes within an hour or two: collect it as soon as it is done.
    - cron: '45 2-12/2 * * *' # 02:45, 04:45 … 12:45 UTC: collect only
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        type: choice
        options: [pilot, visualize, submit, collect, report, diag]
        default: collect
      count:
        description: 'pilot: number of senses (default 50); visualize: at most this many; submit: batch size'
        type: string
        default: ''

concurrency:
  group: images-${{ inputs.job }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: bikcjlomrjaxymifxogi

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check for the Claude key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Repository secret ANTHROPIC_API_KEY is not set: picture jobs skipped (docs/setup-backend.md)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.key.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.key.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run the picture jobs
        if: steps.key.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_IMAGE_MODEL: ${{ vars.CLAUDE_IMAGE_MODEL }}
          CLAUDE_CHECK_MODEL: ${{ vars.CLAUDE_CHECK_MODEL }}
          CLAUDE_MONTHLY_CREDIT_USD: ${{ vars.CLAUDE_MONTHLY_CREDIT_USD }}
          SERVICE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          JOB: ${{ inputs.job || (github.event.schedule == '30 1 * * *' && 'nightly') || 'collect' }}
          COUNT: ${{ inputs.count }}
          # Bulk drawing is on by default (watercolour, owner, 2026-10-25); IMAGE_BULK=false pauses it.
          IMAGE_BULK: ${{ vars.IMAGE_BULK }}
        run: |
          set -euo pipefail
          case "$JOB" in nightly|pilot|visualize|submit|collect|report|diag) ;; *) echo "::error::Unknown job"; exit 1 ;; esac
          if [ -n "$COUNT" ] && ! [[ "$COUNT" =~ ^[0-9]{1,5}$ ]]; then echo "::error::count must be a whole number"; exit 1; fi
          key="$SERVICE_KEY_SECRET"
          if [ -z "$key" ]; then
            if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
              echo "::error::Set SUPABASE_SERVICE_ROLE_KEY, or SUPABASE_ACCESS_TOKEN with API key read access (docs/setup-backend.md)"
              exit 1
            fi
            # Read without printing: the response goes to a private temp file, the key is masked.
            umask 077
            f="$(mktemp)"
            trap 'rm -f "$f"' EXIT
            status=$(curl -sS -o "$f" -w '%{http_code}' \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true")
            if [ "$status" != "200" ]; then
              echo "::error::Could not read the project's API keys (HTTP $status). Set the SUPABASE_SERVICE_ROLE_KEY secret instead."
              exit 1
            fi
            key=$(jq -r '([.[] | select(.type == "secret")] + [.[] | select(.name == "service_role")])[0].api_key // empty' "$f")
            if [ -z "$key" ]; then echo "::error::No secret or service_role key found"; exit 1; fi
          fi
          echo "::add-mask::$key"
          export SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co"
          export SUPABASE_SERVICE_ROLE_KEY="$key"
          case "$JOB" in
            nightly)
              node scripts/img-batch.ts collect
              node scripts/img-batch.ts visualize
              if [ "$IMAGE_BULK" != "false" ]; then
                node scripts/img-batch.ts submit --max 2000
              else
                echo "::notice::IMAGE_BULK is 'false': no new batch submitted (bulk drawing paused)."
              fi
              ;;
            pilot)
              node scripts/img-pilot.ts ${COUNT:+--n "$COUNT"} --out pilot-report.json
              ;;
            visualize)
              node scripts/img-batch.ts visualize ${COUNT:+--limit "$COUNT"}
              ;;
            submit)
              node scripts/img-batch.ts submit ${COUNT:+--max "$COUNT"}
              ;;
            collect)
              node scripts/img-batch.ts collect
              ;;
            report)
              node scripts/img-report.ts
              ;;
            diag)
              node scripts/wc-diag.ts
              ;;
          esac

      - name: Keep the pilot report
        if: steps.key.outputs.run == 'true' && inputs.job == 'pilot' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-report
          path: pilot-report.json
          if-no-files-found: ignore
          retention-days: 30

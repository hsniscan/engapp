# Pre-generated pronunciation audio (decision 0042). Makes an MP3 of every lexicon headword and
# every public example sentence, in both accents, with Kokoro-82M (Apache-2.0) on the
# runners' CPUs, and uploads them to the public `tts` Storage bucket, where the app plays them
# directly (no edge-function call). No paid API and no Gemini call.
#
# Resumable and idempotent: each run lists what the bucket already has and only makes what is
# missing, uploading every clip as soon as it is made; a cancelled or timed-out run is simply
# run again. Work is split into `shards` parallel jobs by file hash.
#
# Usual sequence: run with plan_only (counts, current bucket size, estimates; makes nothing),
# then a full run (default 8 shards: about 1.5 hours for ~40 000 clips), then optionally
# prune_ondemand to delete the older Gemini WAV files that the MP3s replace.
# With the repository variable TTS_PREGEN_WEEKLY=true a weekly run picks up new words.
# source=graded reads the graded library's approved sentences instead (en-US only, decision
# 0047); the graded library workflow (graded.yml) calls this workflow that way every night.
#
# Repository secrets (the same as the word bank job):
#   SUPABASE_SERVICE_ROLE_KEY  the project's service_role (or sb_secret_) key, or else
#   SUPABASE_ACCESS_TOKEN      a token with "API keys: Read" (the key is read and masked).
# Optional, Cloudflare R2 (decision 0053): with the secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET and the variable AUDIO_BASE_URL set, new clips go to R2
# instead of Supabase Storage (a clip in either bucket counts as made). Without them nothing
# changes.
name: Pronunciation audio

on:
  schedule:
    - cron: '30 4 * * 0' # Sundays 04:30 UTC; does nothing unless TTS_PREGEN_WEEKLY is 'true'
  workflow_dispatch:
    inputs:
      voice:
        description: 'Accent(s) to make'
        type: choice
        options: [both, en-US, en-GB]
        default: both
      shards:
        description: 'Parallel jobs (1-20)'
        type: string
        default: '8'
      max:
        description: 'At most this many clips per job (empty: no cap)'
        type: string
        default: ''
      plan_only:
        description: 'Only report counts, bucket size and estimates; make nothing'
        type: boolean
        default: false
      prune_ondemand:
        description: 'Afterwards delete the on-demand Gemini WAVs that an MP3 now replaces'
        type: boolean
        default: false
      source:
        description: 'What to read aloud: the dictionary, or the graded library (en-US only)'
        type: choice
        options: [dictionary, graded]
        default: dictionary
  # The graded library workflow (graded.yml) calls this with source=graded.
  workflow_call:
    inputs:
      voice:
        type: string
        default: en-US
      shards:
        type: string
        default: '1'
      max:
        type: string
        default: ''
      plan_only:
        type: boolean
        default: false
      prune_ondemand:
        type: boolean
        default: false
      source:
        type: string
        default: graded

concurrency:
  group: tts-pregen
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: bikcjlomrjaxymifxogi
  # Kokoro-82M v1.0 as ONNX (kokoro-onnx release files), pinned by hash.
  KOKORO_BASE_URL: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
  KOKORO_MODEL_SHA256: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
  KOKORO_VOICES_SHA256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
  # Cloudflare R2 (decision 0053); empty when the secrets are not set.
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  AUDIO_BASE_URL: ${{ vars.AUDIO_BASE_URL }}

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || vars.TTS_PREGEN_WEEKLY == 'true' || inputs.source == 'graded'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      count: ${{ steps.shards.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Shards
        id: shards
        env:
          SHARDS: ${{ github.event_name == 'schedule' && '1' || inputs.shards }}
        run: |
          set -euo pipefail
          if ! [[ "$SHARDS" =~ ^[0-9]{1,2}$ ]] || [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then
            echo "::error::shards must be 1-20"; exit 1
          fi
          echo "count=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "list=$(jq -cn --argjson n "$SHARDS" '[range(0; $n)]')" >> "$GITHUB_OUTPUT"

      - name: Plan (reads only)
        env:
          SERVICE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VOICE: ${{ inputs.voice || 'both' }}
          SOURCE: ${{ inputs.source || 'dictionary' }}
        run: |
          set -euo pipefail
          source scripts/supabase-service-env.sh
          node scripts/tts-pregen.ts plan --voice "$VOICE" --source "$SOURCE"

  generate:
    needs: plan
    if: ${{ !inputs.plan_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/tts-requirements.txt
      - name: Install the Kokoro worker
        run: pip install -r scripts/tts-requirements.txt

      - name: Cache the Kokoro model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kokoro
          key: kokoro-onnx-v1.0-${{ env.KOKORO_MODEL_SHA256 }}
      - name: Download the Kokoro model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kokoro"
          cd "$RUNNER_TEMP/kokoro"
          curl -fsSL --retry 3 -o kokoro-v1.0.onnx "$KOKORO_BASE_URL/kokoro-v1.0.onnx"
          curl -fsSL --retry 3 -o voices-v1.0.bin "$KOKORO_BASE_URL/voices-v1.0.bin"
          echo "$KOKORO_MODEL_SHA256  kokoro-v1.0.onnx" | sha256sum -c -
          echo "$KOKORO_VOICES_SHA256  voices-v1.0.bin" | sha256sum -c -

      - name: Make and upload the missing clips
        env:
          SERVICE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VOICE: ${{ inputs.voice || 'both' }}
          SOURCE: ${{ inputs.source || 'dictionary' }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.count }}
          # Weekly: new dictionary entries only, so a small cap is plenty.
          MAX: ${{ github.event_name == 'schedule' && '4000' || inputs.max }}
        run: |
          set -euo pipefail
          if [ -n "$MAX" ] && ! [[ "$MAX" =~ ^[0-9]{1,6}$ ]]; then echo "::error::max must be a whole number"; exit 1; fi
          source scripts/supabase-service-env.sh
          mkdir -p "$RUNNER_TEMP/tts-out"
          args=(run --voice "$VOICE" --source "$SOURCE" --shard "$SHARD" --shards "$SHARDS" --minutes 330
            --model "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx" --voices "$RUNNER_TEMP/kokoro/voices-v1.0.bin"
            --python "$(command -v python)" --out "$RUNNER_TEMP/tts-out")
          if [ -n "$MAX" ]; then args+=(--max "$MAX"); fi
          node scripts/tts-pregen.ts "${args[@]}"

  prune:
    needs: [plan, generate]
    if: ${{ inputs.prune_ondemand && !inputs.plan_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the on-demand WAVs that an MP3 replaces
        env:
          SERVICE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/supabase-service-env.sh
          node scripts/tts-pregen.ts prune-ondemand

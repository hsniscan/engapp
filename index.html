<!doctype html>
<html lang="tr" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Engapp</title>
    <meta name="description" content="İngilizce kelimeleri aralıklı tekrarla öğren. Çevrimdışı çalışır." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101312" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <script>
      // Apply the stored theme before first paint (no flash). Mirrors src/ui/theme/theme.ts.
      (function () {
        try {
          var p = localStorage.getItem('engapp.theme');
          if (p !== 'light' && p !== 'dark') p = 'system';
          document.documentElement.dataset.theme = p;
          if (p !== 'system') {
            var c = p === 'dark' ? '#101312' : '#f3f4f1';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.content = c;
            });
          }
        } catch (e) {}
        // Android text-selection sheet (docs/decisions/0046): its activity starts on /quick and
        // is see-through, so the page must not paint the canvas over the calling app.
        try {
          var cap = window.Capacitor;
          if (location.pathname === '/quick' && cap && cap.isNativePlatform && cap.isNativePlatform())
            document.documentElement.dataset.quickHost = 'true';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
